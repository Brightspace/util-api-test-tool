# This is a basic workflow to help you get started with Actions

name: ci
# Controls when the action will run. Triggers the workflow on push or pull request
# events not on master
on:
  push:
    branches:
      - '**'
      - '!master'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: Brightspace/third-party-actions@actions/checkout
      - name: Setup Node
        uses: Brightspace/setup-node@main
        with:
          node-version: 24
          d2l-registry-token: ${{ secrets.D2L_PACKAGE_REGISTRY_AUTH_TOKEN }}

      - name: Install packages
        run: |
          npm i

      - name: Npm Build
        run: npm run build

      - name: Cdk Diff ApiTestToolSetupStack
        run: npx cdk diff ApiTestToolSetupStack  

      - name: Cdk Diff ApiTestToolAppStack
        run: npx cdk diff ApiTestToolAppStack

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: Brightspace/third-party-actions@aws-actions/amazon-ecr-login

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: api_test_tool_repository
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # cd ..
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./src
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Log out of Amazon ECR
        if: always()
        run: docker logout ${{ steps.login-ecr.outputs.registry }}
